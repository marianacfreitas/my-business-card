name: Build LaTeX document
on: [push]

permissions:
  contents: write
  
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: card.tex
      - name: Commit card.pdf
        run: |
          git config user.name "marianacfreitas"
          git config user.email "marianacfreitas2004@gmail.com"
          git add card.pdf
          git commit -m "Update card.pdf" || exit 0
          git push
